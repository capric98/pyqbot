name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv.lock 与 pyproject.toml 不一致时直接失败，而不是在 CI 里悄悄重新解析。
  UV_LOCKED: "1"

jobs:
  check:
    name: 检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # setup-uv 不发布 v10 这类浮动大版本标签，两个 action 统一按提交固定。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-python: true

      - name: 安装依赖
        id: sync
        run: uv sync

      # 依赖装好后，后面几步互不依赖：一步失败时其余照跑，一次看到全部问题。
      - name: ruff check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check --output-format=github

      - name: ruff format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff format --check --diff

      - name: pyright
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pyright

      - name: pytest
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest
